[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "t2s"
version = "0.4.0"
description = "Read documents aloud with macOS say(1), paragraph by paragraph — gapless in-process playback, pausable, 72-column display, resilient to audio device changes."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["miniaudio>=1.61"]

[project.scripts]
t2s = "t2s:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[dependency-groups]
dev = ["mypy>=1.15", "ruff>=0.9"]

[tool.setuptools]
py-modules = ["t2s"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
    "RET",
    "PERF",
]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["t2s.py", "tests"]

[[tool.mypy.overrides]]
module = "miniaudio"
ignore_missing_imports = true
