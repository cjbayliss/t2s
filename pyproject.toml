[project]
name = "t2s"
description = "Read documents aloud with macOS say(1), paragraph by paragraph - gapless in-process playback, pausable, 72-column display, resilient to audio device changes."
readme = "README.md"
requires-python = ">=3.14"
version = "0.8.0"
dependencies = ["miniaudio>=1.61"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.9",
    "mypy>=1.15",
    "hypothesis>=6",
]

[project.scripts]
t2s = "t2s.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "--cov=t2s --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["t2s"]
parallel = true

[tool.coverage.report]
exclude_lines = ["assert_never", "\\(Protocol\\)", "if __name__ == .__main__.:"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["C4", "E", "F", "PERF", "FURB", "W", "I", "B", "SIM", "RET", "UP", "PLW0602", "PLW0603"]

[tool.mypy]
strict = true
warn_unreachable = true
explicit_package_bases = true
python_version = "3.14"
mypy_path = ["src", "tests"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "miniaudio"
ignore_missing_imports = true

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
